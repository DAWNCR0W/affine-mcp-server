name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main
      - fix/**
      - feat/**
      - chore/**

jobs:
  validate:
    name: Validate on Node.js ${{ matrix.node-version }}
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'develop' || (github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Markdown export safety
        run: npm run test:markdown-export-safety

      - name: Test notification contracts
        run: npm run test:notification-contract

      - name: Verify live-test safety guard
        run: npm run test:live-safety

      - name: Verify tool manifest
        run: npm run test:tool-manifest

      - name: Test release verification
        run: npm run test:release-verification

      - name: Verify documentation references
        run: npm run test:docs

      - name: Verify MCP result contracts
        run: npm run test:mcp-result-contract

      - name: Verify document mutation safety
        run: npm run test:document-mutation-safety

      - name: Verify external URL safety
        run: npm run test:url-safety

      - name: Verify input and destructive confirmation contracts
        run: npm run test:input-contracts

      - name: Verify destructive mutation outcomes
        run: npm run test:mutation-ack

      - name: Verify blob upload contracts
        run: npm run test:blob-upload-contract

      - name: Verify secure identifier generation
        run: npm run test:secure-random

      - name: Verify tool surface filtering
        run: npm run test:tool-filtering

      - name: Verify pull request branch route policy
        run: npm run test:pr-route-policy

      - name: Test configuration consistency
        run: npm run test:config-consistency

      - name: Verify authentication session state
        run: npm run test:auth-session

      - name: Verify OAuth service-account policy
        run: npm run test:oauth-service-policy

      - name: Verify HTTP security policy
        run: npm run test:http-security

      - name: Verify HTTP runtime safety
        run: npm run test:http-runtime

      - name: Check package contents
        run: npm run pack:check

      - name: Smoke test packed package
        run: |
          ARTIFACT_DIR="$(mktemp -d)"
          trap 'rm -rf "$ARTIFACT_DIR"' EXIT
          PACK_RESULT="$ARTIFACT_DIR/npm-pack.json"
          npm pack --json --pack-destination "$ARTIFACT_DIR" > "$PACK_RESULT"
          TARBALL_NAME="$(node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (result.length !== 1 || !result[0].filename) process.exit(1); process.stdout.write(result[0].filename);' "$PACK_RESULT")"
          npm run test:package-smoke -- --tarball "$ARTIFACT_DIR/$TARBALL_NAME"
